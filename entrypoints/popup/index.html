<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browser Bridge</title>
  <style>
    /* 4px grid · type 18/13/12 · brand colour only on the logo and the primary button · status
       colours only on status · light/dark follow Chrome (owner 11-08, design trials/popup-design). */
    :root{color-scheme:light dark;--brand:#6d5efc;--ok:#1a9e62;--busy:#6d5efc;--idle:#8a8f98;--danger:#d93025;
      --bg:#fff;--bg-2:#f5f6f8;--line:#e7e8ec;--fg:#16181d;--fg-2:#5c6370;--fg-3:#9097a3;--tint:.10;--shadow:0 6px 24px rgba(0,0,0,.14)}
    @media(prefers-color-scheme:dark){:root{--bg:#15161a;--bg-2:#1f2026;--line:#2b2d35;--fg:#f2f3f5;--fg-2:#a4a9b4;--fg-3:#6c717c;--ok:#2fc282;--tint:.16;--shadow:0 6px 24px rgba(0,0,0,.5)}}
    *{box-sizing:border-box}
    body{width:320px;margin:0;background:var(--bg);color:var(--fg);font:13px/20px system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit;color:inherit}
    .hd{height:48px;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;border-bottom:1px solid var(--line);position:relative}
    .hd svg{width:20px;height:20px;flex:none}
    .wm{font-size:14px;font-weight:700;flex:1}
    .icon-btn{width:32px;height:32px;border:0;border-radius:8px;background:none;display:grid;place-items:center;color:var(--fg-2);cursor:pointer}
    .icon-btn:hover,.icon-btn[aria-expanded=true]{background:var(--bg-2)}
    .icon-btn:focus-visible,.card:focus-visible,.menu button:focus-visible,.primary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
    .menu{position:absolute;top:44px;right:8px;width:208px;padding:4px;border-radius:10px;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow);z-index:2}
    .menu button{width:100%;height:36px;border:0;border-radius:6px;background:none;text-align:left;padding:0 12px;cursor:pointer}
    .menu button:hover{background:var(--bg-2)}
    .menu .danger{color:var(--danger)}
    .menu form{padding:8px 8px 4px}
    .menu label{display:block;font-size:12px;font-weight:600;color:var(--fg-2);margin-bottom:6px}
    .menu input{width:100%;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--bg-2);padding:0 10px}
    .hero{padding:28px 24px 24px;text-align:center}
    .orb{position:relative;width:72px;height:72px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center}
    .orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;opacity:var(--tint)}
    .orb::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid currentColor;opacity:.18}
    .orb svg{position:relative;width:32px;height:32px}
    .orb.busy::after{animation:pulse 1.8s ease-out infinite}
    .orb.idle svg{animation:spin 1.6s linear infinite}
    @keyframes pulse{0%{transform:scale(.9);opacity:.35}100%{transform:scale(1.15);opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.orb.busy::after,.orb.idle svg{animation:none}}
    .ok{color:var(--ok)}.busy{color:var(--busy)}.idle{color:var(--idle)}
    .title{font-size:18px;line-height:24px;font-weight:700;margin:0 0 4px}
    .desc{color:var(--fg-2);margin:0}
    .card{display:flex;gap:12px;align-items:center;width:calc(100% - 32px);margin:0 16px 16px;padding:12px;border:0;border-radius:10px;background:var(--bg-2);text-align:left;cursor:pointer}
    .card:hover{background:color-mix(in srgb,var(--bg-2) 85%,var(--brand))}
    .fav{width:32px;height:32px;border-radius:8px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;flex:none;overflow:hidden;font-weight:700;color:var(--fg-2)}
    .fav img{width:16px;height:16px}
    .card .k,.card .t,.card .u{display:block}
    .card .k{font-size:11px;line-height:16px;font-weight:600;color:var(--fg-3)}
    .card .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .card .u{font-size:12px;line-height:16px;color:var(--fg-2)}
    .card .text{min-width:0;flex:1}
    .card .go{color:var(--fg-3);flex:none}
    .form{padding:0 16px 16px}
    .form label{display:block;font-size:12px;font-weight:600;color:var(--fg-2);margin:12px 0 6px}
    .form input{width:100%;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg-2);padding:0 12px;font-size:14px}
    .form input:focus{outline:2px solid var(--brand);outline-offset:-1px;background:var(--bg)}
    .primary{width:100%;height:40px;margin-top:16px;border:0;border-radius:8px;background:var(--brand);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
    .primary:disabled{opacity:.6;cursor:default}
    .error{color:var(--danger);font-size:12px;line-height:16px;margin:8px 0 0}
    .notice{margin:0 16px 16px;padding:10px 12px;border-radius:10px;background:var(--bg-2);font-size:12px;line-height:18px;color:var(--fg-2)}
    .notice b{color:var(--fg)}
    .ft{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-top:1px solid var(--line);font-size:12px;color:var(--fg-3)}
    .dev{display:flex;align-items:center;gap:6px;color:var(--fg-2);min-width:0}
    .dev span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7dff"/><stop offset="1" stop-color="#5b47f5"/></linearGradient>
      <symbol id="logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="url(#brand)"/><rect x="7" y="10" width="18" height="14" rx="5" fill="#fff"/><path d="M16 10V6.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="5.6" r="1.8" fill="#fff"/><circle cx="12.3" cy="16.8" r="1.9" fill="#5b47f5"/><circle cx="19.7" cy="16.8" r="1.9" fill="#5b47f5"/><path d="M4.5 15.5v3M27.5 15.5v3" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.6 5.6 1.9-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z" fill="currentColor"/></symbol>
      <symbol id="sync" viewBox="0 0 24 24"><path d="M20 12a8 8 0 0 1-13.7 5.7M4 12a8 8 0 0 1 13.7-5.7M18 3v4h-4M6 21v-4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="dots" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></symbol>
      <symbol id="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>

  <header class="hd">
    <svg aria-hidden="true"><use href="#logo"/></svg>
    <span class="wm">Browser Bridge</span>
    <button class="icon-btn" id="more" aria-label="메뉴" aria-haspopup="menu" aria-expanded="false" hidden><svg width="18" height="18"><use href="#dots"/></svg></button>
    <div class="menu" id="menu" role="menu" hidden>
      <form id="name-form"><label for="device-name">기기 이름</label><input id="device-name" maxlength="40" autocomplete="off"></form>
      <button class="danger" id="reset" role="menuitem">연결 다시 하기</button>
    </div>
  </header>

  <section id="setup" hidden>
    <div class="hero" style="padding-bottom:4px">
      <p class="title">내 서버와 연결하기</p>
      <p class="desc">DCCB 대시보드의 주소와 코드를 넣으면<br>이후로는 알아서 연결됩니다.</p>
    </div>
    <form class="form" id="setup-form">
      <label for="address">주소</label><input id="address" type="url" placeholder="https://…" autocomplete="off" spellcheck="false">
      <label for="code">코드</label><input id="code" type="text" placeholder="Q7M2 K9TX" autocomplete="off" spellcheck="false">
      <p class="error" id="setup-error" hidden></p>
      <button class="primary" id="connect" type="submit">연결</button>
    </form>
  </section>

  <section id="status" hidden>
    <div class="hero">
      <div class="orb" id="orb"><svg><use id="orb-icon" href="#check"/></svg></div>
      <p class="title" id="title"></p>
      <p class="desc" id="desc"></p>
    </div>
    <button class="card" id="card" type="button" hidden>
      <span class="fav" id="fav"></span>
      <span class="text"><span class="k">지금 보는 페이지 · 누르면 이동</span><span class="t" id="page-title"></span><span class="u" id="page-host"></span></span>
      <svg class="go" width="16" height="16"><use href="#chev"/></svg>
    </button>
    <p class="notice" id="update" hidden></p>
  </section>

  <footer class="ft"><span class="dev"><span class="dot" id="dev-dot"></span><span id="device"></span></span><span id="version"></span></footer>
  <script type="module" src="./main.ts"></script>
</body>
</html>
